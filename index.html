<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<title>Celebrating Your 400th Performance</title>

<style>
body{
     margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#FFF8C8;

    font-family:"Shippori Mincho",serif;
}

/* カード本体 */
.card{
    position:relative;

    background:white;

    width:min(90%,650px);

    padding:50px 40px;

    text-align:center;

    border:3px solid #008746;
    box-shadow:
        0 10px 25px rgba(0,0,0,.08),
        0 2px 6px rgba(0,0,0,.05);

    opacity:0;
    animation:fadeUp 1.2s ease forwards;
}

/* 内側の装飾枠 */
.card::before{
    content:"";

    position:absolute;
    inset:12px;

    border:1px solid #A7D4B8;
    pointer-events:none;
}

h1{
    color:#008746;
    margin-bottom:20px;
    
}

/* 400th */

.number{
    color:#0E5A33;

    font-size:6rem;

    line-height:1;

    font-weight:600;

    margin:0;
}

.number span{
    font-size:2.2rem;
}

/* Performance! */

.performance{
    font-family:"Great Vibes",cursive;

    font-size:3rem;

    color:#0E5A33;

    margin-top:-10px;
}

/* リボン */

.ribbon{
    display:inline-block;

    background:#008746;

    color:white;

    padding:12px 24px;

    margin:25px 0;

    font-size:1rem;

    letter-spacing:.05em;
}

/* 装飾 */

.ornament{
    color:#7BBF8E;

    font-size:1.2rem;

    letter-spacing:.5rem;

    margin-bottom:25px;
}


/* メッセージ */
.message{
    line-height:2.2;
    color:#444;
     opacity:0;

    animation:fadeUp 1.2s ease forwards;

    animation-delay:.8s;
}


/* アニメーション */
@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media (max-width: 640px){
    .card{
        margin:20px;
        padding:30px 24px;
    }

    h1{
        font-size:1.8rem;
    }
}
</style>
</head>

<body>

<div class="card">

<h1>SPECIAL STAGE!!</h1>

 <div class="number">
        400<span>th</span>
    </div>

    <div class="performance">
        Performance!
    </div>

 <div class="ribbon">
        Congratulations on your 400th Performance!
    </div>

    <div class="ornament">
        ❦ ❦ ❦ ❦ ❦ ❦
    </div>

<div class="message">
400回ご出演おめでとうございます!<br><br>

いつも素敵な時間と笑顔を<br>届けてくださり、ありがとうございます。<br>
これからもますますのご活躍をお祈り申し上げます。
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script>
window.addEventListener('load', function() {

  confetti({
    particleCount: 150,
    spread: 100,
    origin: {
      y: 0.6
    }
  });

  setTimeout(function() {
    confetti({
      particleCount: 80,
      angle: 60,
      spread: 70,
      origin: {
        x: 0,
        y: 0.7
      }
    });
  }, 300);

  setTimeout(()=> {
    confetti({
      particleCount:80,
      angle:120,
      spread:70,
      origin:{
        x:1,
        y:0.7
      }
    });
  },500);

});
</script>

</body>
</html>
